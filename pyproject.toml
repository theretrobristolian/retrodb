[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "retrodb"
version = "0.1.0"
description = "Self-hosted catalogue and browser for retro-game collections"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.3",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
